# DevSecOps pipeline: every push and PR must pass ALL gates before merge.
#   secrets -> build+tests+coverage -> SAST -> dependency review -> SBOM
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token can only read the repo unless a job asks for more.
permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # scan full history, not just the last commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, unit + abuse-case tests, coverage gate (>=80%)
        run: mvn -B verify
      - name: SAST - SpotBugs + FindSecBugs
        run: mvn -B spotbugs:check
      - name: SBOM - CycloneDX
        run: mvn -B cyclonedx:makeAggregateBom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-and-coverage
          path: |
            target/bom.json
            target/site/jacoco/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
